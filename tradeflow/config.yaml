NOTES:
  1: COUNTRY.list "default" = run only incomplete ones within AU, BR, CA,
    CN, DE, FR, GB, IN, IT, JP, KR, RU, WM, US
  2: COUNTRY.list "all" = run all (could take hours)
  3: COUNTRY.list "comprehensive" = push every Exiobase region (all 49 —
    see PLAN-comprehensive.md) directly to Azure for one year. No
    per-country trade_id blocks. Set TRADEFLOW to anything; comprehensive
    ignores it (imports/exports/domestic all come out of one extraction —
    see PLAN-comprehensive.md). Writes a local year/[year]/[country]/
    folder for every one of the 49 regions by default — set
    COMPREHENSIVE.folders to "default" to only write folders for the 14
    default-list countries instead (every region is still pushed to Azure
    either way; this only controls local .csv output).
  4: COMPREHENSIVE.target picks the Azure database — "year_db" (default) —
    a dedicated industrydb_[year] database, created if missing, with no
    year column needed since trade_id is globally sequential within that
    database. Set to "industrydb" to instead push to the shared,
    multi-year database, with year as a real column on trade/trade_factor
    and trade_id unique only per year (see PLAN-comprehensive.md's
    "Database write path"). EXIOBASE_COMPREHENSIVE_TARGET overrides this
    setting the same way EXIOBASE_COMPREHENSIVE_FOLDERS overrides
    COMPREHENSIVE.folders. DB_TARGET is a short alias for
    EXIOBASE_COMPREHENSIVE_TARGET (same for YEAR/EXIOBASE_YEAR and
    COUNTRY_LIST/EXIOBASE_COUNTRY_LIST) -- e.g. YEAR=2018
    COUNTRY_LIST=comprehensive DB_TARGET=industrydb python main.py.
    DB_TARGET is optional; with multiple comma-separated YEARs it can be
    one value for all of them or a comma-separated list (one per year,
    same order) -- an explicit industrydb_[year] entry whose year doesn't
    match its position's YEAR value stops the run before anything starts,
    instead of silently pushing that year's data into the wrong database.
TRADEFLOW: domestic,imports,exports
YEAR: 2021
COUNTRY:
  list: US
COMPREHENSIVE:
  folders: all
  target: year_db
NODES:
  exiobase:
    source_python: main.py
    node_id: exiobase
    order: 40
    name: Exiobase Trade Flow
    description: Runs exiobase international tradeflow processing.
    link: exiobase/tradeflow
    python_cmds: python main.py
    output_path: ../../../trade-data/year/[year]/
    output_info: Exiobase trade tables
    folder_size: unknown
    dependencies: '{detected_dependencies}'
    data_sources: Exiobase MRIO
    target_repo: trade-data
  us_bea:
    source_python: us-bea.py
    node_id: us_bea
    order: 45
    parent_node: exiobase
    name: US BEA Trade Flow
    description: Runs exiobase US-BEA tradeflow integration and writes US trade-data
      outputs.
    link: exiobase/tradeflow
    python_cmds: python us-bea.py
    output_path: ../../../trade-data/year/[year]/US/
    output_info: US BEA enhanced trade tables
    folder_size: unknown
    dependencies: '{detected_dependencies}'
    api_keys_required: BEA_API_KEY
    data_sources: Exiobase MRIO,US BEA API,FEDEFL
    target_repo: trade-data
  india:
    source_python: india/main.py
    node_id: india
    order: 46
    parent_node: exiobase
    name: India State Allocation
    description: Disaggregates India national statistics to states/UTs and maps Indian
      GSVA activity text and HS products to Exiobase industry_id codes shared with
      US trade-data outputs.
    link: exiobase/tradeflow/india
    python_cmds: python india/main.py
    output_path: ../../../trade-data/year/[year]/IN/domestic/
    output_info: India state matrices; india_us_exiobase crosswalk; aligns industry_id
      with US MRIO
    folder_size: unknown
    dependencies: '{detected_dependencies}'
    data_sources: India MOSPI GSDP/GSVA, TradeStat HS, India SUT, HS_EXIOBASE_mapping
    target_repo: trade-data
FOLDERS:
  base: ../../trade-data/year/{year}
  imports: ../../trade-data/year/{year}/{country}/imports
  exports: ../../trade-data/year/{year}/{country}/exports
  domestic: ../../trade-data/year/{year}/{country}/domestic
FILES:
  factors: factor.csv
  industries: industry.csv
  sectors: sector.csv
  sector_industry: sector_industry.csv
  industryflow: trade.csv
  trade_factor: trade_factor.csv
  trade_factor_domestic: trade_factor_lg.csv
  interstate_factor: interstate_factor.csv
  interstate_factor_lg: interstate_factor_lg.csv
  trade_impact: trade_impact.csv
  trade_resource: trade_resource.csv
  trade_material: trade_material.csv
  trade_employment: trade_employment.csv
PROCESSING:
  sample_size: 1000
  min_impact_threshold: 0.001
  use_partial_factors_interstate: true
